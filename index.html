<html>
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="stylesheet" href="index.css" />
	</head>
	<body>
		<header>
			<img src="images/logo.png" />
			<img src="images/user-avatar.jpg" alt="profile pic" class="profile-img" />
		</header>
		<hr class="navbar-line" />

		<main id="posts">
			<article class="post">
				<div class="post-header">
					<img src="images/avatar-vangogh.jpg" class="avatar" />
					<div class="user-info">
						<strong>Vincent van Gogh</strong>
						<p>Zundert, Netherlands</p>
					</div>
				</div>

				<img
					src="images/post-vangogh.jpg"
					class="post-image"
					alt="painting by vangogh"
				/>

				<div class="post-content">
					<div class="post-icons">
						<img src="images/icon-heart.png" alt="Like button" />
						<img src="images/icon-comment.png" alt="Comment button" />
						<img src="images/icon-dm.png" alt="Share button" />
					</div>

					<p class="likes">21,492 likes</p>

					<p class="caption">
						<strong>vincey1853</strong>
						just took a few mushrooms lol
					</p>
				</div>
			</article>


            <article class="post">
				<div class="post-header">
					<img src="images/avatar-vangogh.jpg" class="avatar" />
					<div class="user-info">
						<strong>Gustave Courbet</strong>
						<p>Ornans, France</p>
					</div>
				</div>

				<img
					src="images/post-courbet.jpg"
					class="post-image"
					alt="painting by Courbet"
				/>

				<div class="post-content">
					<div class="post-icons">
						<img src="images/icon-heart.png" alt="Like button" />
						<img src="images/icon-comment.png" alt="Comment button" />
						<img src="images/icon-dm.png" alt="Share button" />
					</div>

					<p class="likes">21,492 likes</p>

					<p class="caption">
						<strong>vincey1853</strong>
						just took a few mushrooms lol
					</p>
				</div>
			</article>
		</main>

		<script src="index.js"></script>
	</body>
</html>
